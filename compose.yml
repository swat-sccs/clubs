services:
  clubs:
    build: .
    image: clubs:local
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER must be set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@clubs-db:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET must be set in .env}"
      AUTH_URL: "${AUTH_URL:?AUTH_URL must be set in .env}"
      AUTH_TRUST_HOST: "${AUTH_TRUST_HOST:?AUTH_TRUST_HOST must be set in .env}"
      AUTH_KEYCLOAK_ID: "${AUTH_KEYCLOAK_ID:?AUTH_KEYCLOAK_ID must be set in .env}"
      AUTH_KEYCLOAK_SECRET: "${AUTH_KEYCLOAK_SECRET:?AUTH_KEYCLOAK_SECRET must be set in .env}"
      AUTH_KEYCLOAK_ISSUER: "${AUTH_KEYCLOAK_ISSUER:?AUTH_KEYCLOAK_ISSUER must be set in .env}"
      KEYCLOAK_ADMIN_GROUP: "${KEYCLOAK_ADMIN_GROUP:?KEYCLOAK_ADMIN_GROUP must be set in .env}"
      MATCHER_URL: "${MATCHER_URL:?MATCHER_URL must be set in .env}"
    ports:
      - "3000:3000"
    depends_on:
      clubs-db:
        condition: service_healthy

  clubs-matcher:
    build: ./matcher
    image: clubs-matcher:local
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER must be set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@clubs-db:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}"
      EMBEDDINGS_URL: "${EMBEDDINGS_URL:?EMBEDDINGS_URL must be set in .env}"
    depends_on:
      clubs-db:
        condition: service_healthy

  clubs-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set in .env}"
    volumes:
      - clubs-dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username $$POSTGRES_USER --dbname $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clubs-dbdata:
    name: clubs-dbdata
    driver_opts:
      type: nfs
      o: nfsvers=4,addr=130.58.218.26,rw,nolock,soft
      device: :/volumes/clubs-dbdata
