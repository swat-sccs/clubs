services:
  clubs:
    build:
      context: .
      target: runner
    image: clubs:local
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER must be set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@clubs-db:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET must be set in .env}"
      AUTH_URL: "${AUTH_URL:?AUTH_URL must be set in .env}"
      AUTH_TRUST_HOST: "${AUTH_TRUST_HOST:?AUTH_TRUST_HOST must be set in .env}"
      AUTH_KEYCLOAK_ID: "${AUTH_KEYCLOAK_ID:?AUTH_KEYCLOAK_ID must be set in .env}"
      AUTH_KEYCLOAK_SECRET: "${AUTH_KEYCLOAK_SECRET:?AUTH_KEYCLOAK_SECRET must be set in .env}"
      AUTH_KEYCLOAK_ISSUER: "${AUTH_KEYCLOAK_ISSUER:?AUTH_KEYCLOAK_ISSUER must be set in .env}"
      KEYCLOAK_ADMIN_GROUP: "${KEYCLOAK_ADMIN_GROUP:?KEYCLOAK_ADMIN_GROUP must be set in .env}"
      MATCHER_URL: "${MATCHER_URL:?MATCHER_URL must be set in .env}"
      CLUB_VISIBILITY_GRACE_DAYS: "${CLUB_VISIBILITY_GRACE_DAYS:-14}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      RATE_LIMIT_SECRET: "${RATE_LIMIT_SECRET:?RATE_LIMIT_SECRET must be set in .env}"
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET_NAME: "${S3_BUCKET_NAME:-club-uploads}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set in .env}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set in .env}"
      MODERATION_CONCURRENCY: "${MODERATION_CONCURRENCY:-1}"
      NSFW_PORN_THRESHOLD: "${NSFW_PORN_THRESHOLD:-0.25}"
      NSFW_HENTAI_THRESHOLD: "${NSFW_HENTAI_THRESHOLD:-0.25}"
      NSFW_SEXY_THRESHOLD: "${NSFW_SEXY_THRESHOLD:-0.45}"
      NSFW_COMBINED_THRESHOLD: "${NSFW_COMBINED_THRESHOLD:-0.50}"
    depends_on:
      clubs-db:
        condition: service_healthy
      clubs-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777
      - /app/.next/cache:uid=1001,gid=1001,mode=0755
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  clubs-migrate:
    build:
      context: .
      target: migrate
    image: clubs-migrate:local
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER must be set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@clubs-db:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}"
    depends_on:
      clubs-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:uid=1002,gid=1002,mode=1777
    security_opt:
      - no-new-privileges:true

  clubs-matcher:
    build: ./matcher
    image: clubs-matcher:local
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER must be set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@clubs-db:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}"
      EMBEDDINGS_URL: "${EMBEDDINGS_URL:?EMBEDDINGS_URL must be set in .env}"
      CLUB_VISIBILITY_GRACE_DAYS: "${CLUB_VISIBILITY_GRACE_DAYS:-14}"
    depends_on:
      clubs-db:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  clubs-db:
    image: postgres:16.15-alpine3.23
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set in .env}"
    volumes:
      - clubs-dbdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username $$POSTGRES_USER --dbname $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio_storage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}"
    volumes:
      - clubs-miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  clubs-dbdata:
    name: clubs-dbdata
    driver_opts:
      type: nfs
      o: nfsvers=4,addr=130.58.218.26,rw,hard,timeo=600,retrans=2
      device: :/volumes/clubs-dbdata
  clubs-miniodata:
    name: clubs-miniodata
    driver_opts:
      type: nfs
      o: nfsvers=4,addr=130.58.218.26,rw,hard,timeo=600,retrans=2
      device: :/volumes/clubs-miniodata
