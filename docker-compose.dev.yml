# Local development database only. Run with:
#   docker compose -f docker-compose.dev.yml up -d
# and set DATABASE_URL=postgresql://clubs:clubs@localhost:5432/clubs
services:
  clubs-dev-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: clubs
      POSTGRES_PASSWORD: clubs
      POSTGRES_DB: clubs
    volumes:
      - clubs-dev-dbdata:/var/lib/postgresql/data

volumes:
  clubs-dev-dbdata:
