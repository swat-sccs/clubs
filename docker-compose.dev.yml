# Local development environment. Run with:
#   docker compose -f docker-compose.dev.yml up --build
# The frontend is available at http://localhost:3000.
services:
  clubs-dev-db:
    image: postgres:16.15-alpine3.23
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clubs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clubs}
      POSTGRES_DB: ${POSTGRES_DB:-clubs}
    volumes:
      - clubs-dev-dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username $$POSTGRES_USER --dbname $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  clubs-dev-frontend:
    build:
      context: .
      target: dependencies
    # The named node_modules volume can outlive a schema change, so regenerate
    # the client after migrations before starting Next.js.
    command: sh -c "bunx prisma migrate deploy && bunx prisma generate && bun run dev -- --hostname 0.0.0.0"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-clubs}:${POSTGRES_PASSWORD:-clubs}@clubs-dev-db:5432/${POSTGRES_DB:-clubs}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-club-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-clubs-dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-clubs-development-secret}
      CLUB_VISIBILITY_GRACE_DAYS: ${CLUB_VISIBILITY_GRACE_DAYS:-14}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:-local-development-rate-limit-secret}
      TRUST_PROXY_HEADERS: "false"
      MODERATION_CONCURRENCY: ${MODERATION_CONCURRENCY:-1}
      NSFW_PORN_THRESHOLD: ${NSFW_PORN_THRESHOLD:-0.25}
      NSFW_HENTAI_THRESHOLD: ${NSFW_HENTAI_THRESHOLD:-0.25}
      NSFW_SEXY_THRESHOLD: ${NSFW_SEXY_THRESHOLD:-0.45}
      NSFW_COMBINED_THRESHOLD: ${NSFW_COMBINED_THRESHOLD:-0.50}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - clubs-dev-node_modules:/app/node_modules
    depends_on:
      clubs-dev-db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    ports:
      - "8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-clubs-dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-clubs-development-secret}
      S3_BUCKET: ${S3_BUCKET_NAME:-club-uploads}
    volumes:
      - clubs-dev-seaweeddata:/data
    command: ["mini", "-dir=/data"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  clubs-dev-dbdata:
  clubs-dev-node_modules:
  clubs-dev-seaweeddata:
