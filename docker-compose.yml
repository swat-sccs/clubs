services:
  clubs:
    build: .
    image: clubs:local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3001:3000"
    depends_on:
      clubs-db:
        condition: service_healthy

  clubs-matcher:
    build: ./matcher
    image: clubs-matcher:local
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      clubs-db:
        condition: service_healthy

  clubs-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clubs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: clubs
    volumes:
      - clubs-dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username clubs --dbname clubs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clubs-dbdata:
